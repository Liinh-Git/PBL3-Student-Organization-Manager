version: '3.8'
services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-org_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123@@}
      POSTGRES_DB: ${POSTGRES_DB:-StudentOrgDb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: